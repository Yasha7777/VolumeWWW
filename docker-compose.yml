services:

  backend:
    build: ./backend
    restart: unless-stopped
    # логи контейнера не больше 3×10 МБ: без ротации json-логи росли без предела
    # и вместе с кэшем сборок забили диск сервера (2026-09-29, 100 %)
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    env_file: .env
    expose:
      - "8000"
    networks:
      - app

  frontend:
    # build-args VITE_SUPABASE_* убраны: образ больше не собирает фронт, а
    # раздаёт готовый dist/ из git (см. frontend/Dockerfile). Ключи бакаются
    # на маке из frontend/.env.local. Оставленные здесь args Docker всё равно
    # не смог бы применить и ругался бы «build-args were not consumed».
    build:
      context: ./frontend
    restart: unless-stopped
    # логи контейнера не больше 3×10 МБ: без ротации json-логи росли без предела
    # и вместе с кэшем сборок забили диск сервера (2026-09-29, 100 %)
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app

networks:
  app:
    driver: bridge
