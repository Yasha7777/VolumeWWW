# ════════════════════════════════════════════════════════════════════════
# Проксирование API → backend. Один файл на оба входа в nginx.conf:
#   • домен API (api.volumetric.gottland.ru) — основной, без пароля;
#   • /api/ на домене сайта — для старых вкладок и приложения, пока их не
#     переведут на домен API (за паролем хостового nginx он не работает).
# Кладётся в /etc/nginx/snippets/ (frontend/Dockerfile), НЕ в conf.d:
# оттуда nginx подключил бы его на уровне http и упал.
# ════════════════════════════════════════════════════════════════════════

proxy_pass         http://backend:8000;
proxy_http_version 1.1;
proxy_set_header   Host $host;
proxy_set_header   X-Real-IP $remote_addr;
proxy_set_header   Connection "";

# Для загрузки файлов и долгих запросов (polling)
#
# В бакет уходят ОРИГИНАЛЫ фото (без ресайза — от этого зависит EXIF и
# достоверность объёма, см. prepareImage в Analyze.jsx): кадр iPhone —
# 2-5 МБ вместо прежних 0.7 МБ, а замер — до 100 кадров одним POST.
# Прежние 100m резали такую пачку 413-й ошибкой на ~25-м кадре.
# Потолок держим по бэкенду: MAX_FILES(100) × MAX_FILE_BYTES(20 МБ).
# Реальный ограничитель — проверка размера каждого файла в analyses.py.
client_max_body_size 2g;

# Без буферизации тела: иначе nginx сначала пишет всю пачку (сотни МБ)
# в client_temp и только потом начинает отдавать её бэкенду — двойная
# запись на диск и задержка на весь аплоад. Стримим как есть.
proxy_request_buffering off;

proxy_read_timeout   3700s;  # чуть больше 1 часа
proxy_send_timeout   3700s;

# Ответы API — без временных файлов. Всё, что не влезало в буферы
# (по умолчанию 8×4 КБ), nginx писал в /var/cache/nginx/proxy_temp, и
# на проде такие ответы обрывались: GET /api/analyses/ (≈700 КБ) —
# «Failed to fetch» в Истории, облако обхода — ERR_CONTENT_LENGTH_MISMATCH
# (проверено 2026-09-29: статика того же размера доходит целиком).
# Теперь до 1 МБ держим в памяти, остальное отдаём потоком без диска.
proxy_buffer_size        32k;
proxy_buffers            32 32k;
proxy_busy_buffers_size  64k;
proxy_max_temp_file_size 0;
