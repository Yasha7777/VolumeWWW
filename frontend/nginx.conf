# ════════════════════════════════════════════════════════════════════════
# Контейнерный nginx фронта. Перед ним стоит хостовый nginx (TLS, редирект
# http→https) — его конфига в репозитории нет. Если он сам ставит
# X-Frame-Options, карта кликов Метрики не откроется — см. отчёт/PROGRESS.
#
# ГЛАВНОЕ ПРО ЗАГОЛОВКИ. add_header из server{} НЕ наследуется в location,
# где есть хоть один свой add_header. Раньше так и было: у index.html и
# sw.js были свои add_header, и HTML-страницы уходили БЕЗ CSP и HSTS
# (проверено на проде 2026-09-28). Поэтому теперь ВСЕ
# заголовки — только здесь, на уровне server, а различия по типу ответа
# (кэш, noindex) — через map. НЕ добавляй add_header внутрь location.
# ════════════════════════════════════════════════════════════════════════

# ── Кэш по типу ответа ───────────────────────────────────────────────────
# $uri здесь — уже итоговый файл: try_files и error_page меняют его на
# /index.html, /privacy.html, /shell.html, /404.html.
#   /assets/*  — имена с хэшем → год и immutable;
#   *.html, sw.js — точки входа обновления: НИКОГДА не кэшировать надолго,
#     иначе после деплоя браузер держит старый HTML/SW, а те ссылаются на
#     удалённые чанки → 404 → белый экран;
#   /api/*     — пусто = заголовок не ставим, кэшем API рулит бэкенд;
#   остальное из public (картинки, видео, шрифты PDF, robots, sitemap) —
#     имена без хэша, файл можно заменить → час.
map $uri $kb_cache_control {
    default         "public, max-age=3600";
    ~^/api/         "";
    ~^/assets/      "public, max-age=31536000, immutable";
    ~\.html$        "no-cache";
    /sw.js          "no-cache";
}

# ── noindex для непубличных страниц ──────────────────────────────────────
# Работает без JS (в отличие от мета-тега, который ставит ещё и RouteMeta).
# shell.html — оболочка /login, /register, /app, /history, /profile, /reports.
map $uri $kb_robots {
    default         "";
    /shell.html     "noindex, nofollow";
    /404.html       "noindex, nofollow";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # За хостовым nginx контейнер видит http: абсолютный Location в 301
    # (со слеша на канон) ушёл бы на http:// и дал двойной редирект.
    absolute_redirect off;

    # ── Домены Яндекс Метрики для CSP — ИЗ ДОКУМЕНТАЦИИ, не по памяти ─────
    # yandex.ru/support/metrica/ru/code/install-counter-csp (сверено 2026-09-28):
    #   $ym_src — «Общий список адресов» (https-часть; wss:// уже покрыт
    #     connect-src wss:, https: — connect-src https: и img-src https:);
    #   $ym_frame_ancestors — «Адреса для frame-ancestors»: интерфейс Метрики
    #     (карта кликов, Вебвизор) открывает сайт во фрейме со своих доменов.
    # Меняется список у Яндекса — правь здесь, сверяясь с той же страницей.
    set $ym_src "https://mc.yandex.ru https://mc.yandex.az https://mc.yandex.by https://mc.yandex.co.il https://mc.yandex.com https://mc.yandex.com.am https://mc.yandex.com.ge https://mc.yandex.com.tr https://mc.yandex.ee https://mc.yandex.fr https://mc.yandex.kg https://mc.yandex.kz https://mc.yandex.lt https://mc.yandex.lv https://mc.yandex.md https://mc.yandex.tj https://mc.yandex.tm https://mc.yandex.uz https://mc.webvisor.com https://mc.webvisor.org https://yastatic.net";
    # Яндекс Карты JS API 2.1 (спутник под реальными обходами на /app):
    # скрипт и модули — api-maps.yandex.ru и yastatic.net, тайлы — *.maps.yandex.net
    # (картинки и так разрешены img-src https:). Проверить в консоли, прежде
    # чем переводить Report-Only в боевую политику.
    set $ymaps_src "https://api-maps.yandex.ru https://*.maps.yandex.net https://yandex.ru";
    set $ym_frame_ancestors "https://metrika.yandex.ru https://analytics.yandex.by https://analytics.yandex.com https://analytics.yandex.com.tr https://analytics.yandex.kz https://analytics.yandex.ru https://metr.yandex.by https://metr.yandex.com https://metr.yandex.com.tr https://metr.yandex.kz https://metr.yandex.ru https://metrica.ya.ru https://metrica.yandex https://metrica.yandex.by https://metrica.yandex.com https://metrica.yandex.com.tr https://metrica.yandex.kz https://metrica.yandex.ru https://metrika.ya.ru https://metrika.yandex https://metrika.yandex.by https://metrika.yandex.com https://metrika.yandex.com.tr https://metrika.yandex.kz https://metrika.yandex.uz";

    # ── Заголовки (все — здесь, см. шапку) ────────────────────────────────
    add_header Cache-Control $kb_cache_control always;
    add_header X-Robots-Tag $kb_robots always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # CSP. До 2026-09-28 на HTML она не приходила вовсе (см. шапку), то есть
    # приложение ни разу не работало под ней. Включить её разом = рискнуть
    # /app: предпросмотр PDF из blob, 3D, загрузки — всё это без входа не
    # проверить. Поэтому:
    #   • frame-ancestors — ПРИНУДИТЕЛЬНО. Встраивать сайт во фрейм можно только
    #     себе и интерфейсу Метрики (карта кликов/Вебвизор), чужим — нельзя.
    #     X-Frame-Options убран: в нём нельзя перечислить домены, а при обоих
    #     заголовках браузеры берут frame-ancestors, и SAMEORIGIN только путал.
    #   • остальная политика — Report-Only: браузер пишет нарушения в консоль,
    #     но ничего не блокирует. Пройти приложение с открытой консолью, и если
    #     нарушений нет — переименовать заголовок в Content-Security-Policy
    #     (и дописать туда frame-ancestors из первого).
    # Состав политики: script-src строгий ('self', без inline — полифилл в
    # бандле, загрузчик Метрики тоже) + домены Метрики; 'wasm-unsafe-eval' —
    # wasm-декодеры three/pdf; style-src 'unsafe-inline' — инлайн-стили React;
    # frame-src/child-src blob: — iframe с blob-PDF и Вебвизор/карта кликов
    # (по документации Метрики); worker-src blob: — воркеры three;
    # connect-src широкий (https:/wss:) — GLB/PLY и фото приходят с разных
    # хостов. Google Fonts в политике нет: шрифты свои
    # (src/fonts), к fonts.googleapis.com/gstatic.com сайт не обращается.
    add_header Content-Security-Policy "frame-ancestors 'self' $ym_frame_ancestors" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' $ym_src $ymaps_src; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; frame-src 'self' blob: $ym_src; child-src 'self' blob: $ym_src; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Gzip (html сжимается всегда; xml — sitemap, manifest+json — манифест PWA).
    # Brotli нет: в nginx:alpine нет модуля, нужен сторонний образ.
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               text/xml application/xml application/manifest+json;
    gzip_min_length 1000;

    # Всё, чего нет, — честный 404 со своей страницей (пререндер NotFound).
    # 404.html НЕ internal: service worker прекэширует её прямым запросом и
    # на 404-ответе не установился бы вовсе.
    error_page 404 /404.html;

    # API → backend. ^~ — чтобы regex-локейшены ниже (слеш на конце!) не
    # перехватывали /api/…/: POST /api/analyses/ получил бы 301.
    location ^~ /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Connection "";

        # Для загрузки файлов и долгих запросов (polling)
        #
        # В бакет уходят ОРИГИНАЛЫ фото (без ресайза — от этого зависит EXIF и
        # достоверность объёма, см. prepareImage в Analyze.jsx): кадр iPhone —
        # 2-5 МБ вместо прежних 0.7 МБ, а замер — до 100 кадров одним POST.
        # Прежние 100m резали такую пачку 413-й ошибкой на ~25-м кадре.
        # Потолок держим по бэкенду: MAX_FILES(100) × MAX_FILE_BYTES(20 МБ).
        # Реальный ограничитель — проверка размера каждого файла в analyses.py.
        client_max_body_size 2g;

        # Без буферизации тела: иначе nginx сначала пишет всю пачку (сотни МБ)
        # в client_temp и только потом начинает отдавать её бэкенду — двойная
        # запись на диск и задержка на весь аплоад. Стримим как есть.
        proxy_request_buffering off;

        proxy_read_timeout   3700s;  # чуть больше 1 часа
        proxy_send_timeout   3700s;

        # Ответы API — без временных файлов. Всё, что не влезало в буферы
        # (по умолчанию 8×4 КБ), nginx писал в /var/cache/nginx/proxy_temp, и
        # на проде такие ответы обрывались: GET /api/analyses/ (≈700 КБ) —
        # «Failed to fetch» в Истории, облако обхода — ERR_CONTENT_LENGTH_MISMATCH
        # (проверено 2026-09-29: статика того же размера доходит целиком).
        # Теперь до 1 МБ держим в памяти, остальное отдаём потоком без диска.
        proxy_buffer_size        32k;
        proxy_buffers            32 32k;
        proxy_busy_buffers_size  64k;
        proxy_max_temp_file_size 0;
    }

    # Хэшированные ассеты: только файлы, без фоллбэков.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # ── РОУТЫ SPA — белый список ─────────────────────────────────────────
    # Сверяется со сборкой (scripts/vite-plugin-seo.js): App.jsx, этот файл,
    # src/seo/routes.js и robots.txt обязаны совпадать, иначе `vite build`
    # падает. Новый роут без строки здесь получил бы честный 404.
    # Публичные — пререндер (HTML с текстом и метой без JS):
    location = / {
        try_files /index.html =404;
    }
    location = /privacy {
        try_files /privacy.html =404;
    }
    location = /consent {
        try_files /consent.html =404;
    }
    location = /terms {
        try_files /terms.html =404;
    }
    # Непубличные — пустая оболочка с noindex (map $kb_robots выше):
    location ~ ^/(login|register|app|history|profile|reports)$ {
        try_files /shell.html =404;
    }

    # Один канонический адрес: слеш на конце → 301 без слеша (/privacy/ → /privacy).
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # Манифест PWA: в mime.types образа nginx:1.27-alpine нет webmanifest, и
    # он уходил как application/octet-stream (так было и на проде).
    # default_type, а не types{}: types внутри location заменил бы всю таблицу.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Остальное — только реальные файлы из dist (robots.txt, sitemap.xml,
    # yandex_*.html, картинки, sw.js, манифест…). Нет файла → 404.
    location / {
        try_files $uri =404;
    }
}
