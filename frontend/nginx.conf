# ════════════════════════════════════════════════════════════════════════
# Контейнерный nginx фронта. Перед ним стоит хостовый nginx (TLS, редирект
# http→https) — его конфига в репозитории нет.
#
# ГЛАВНОЕ ПРО ЗАГОЛОВКИ. add_header из server{} НЕ наследуется в location,
# где есть хоть один свой add_header. Раньше так и было: у index.html и
# sw.js были свои add_header, и HTML-страницы уходили БЕЗ CSP и HSTS
# (проверено на проде 2026-09-28). Поэтому теперь ВСЕ
# заголовки — только здесь, на уровне server, а различия по типу ответа
# (кэш, noindex) — через map. НЕ добавляй add_header внутрь location.
# ════════════════════════════════════════════════════════════════════════

# ── Кэш по типу ответа ───────────────────────────────────────────────────
# $uri здесь — уже итоговый файл: try_files и error_page меняют его на
# /index.html, /privacy.html, /shell.html, /404.html.
#   /assets/*  — имена с хэшем → год и immutable;
#   *.html, sw.js — точки входа обновления: НИКОГДА не кэшировать надолго,
#     иначе после деплоя браузер держит старый HTML/SW, а те ссылаются на
#     удалённые чанки → 404 → белый экран;
#   /api/*     — пусто = заголовок не ставим, кэшем API рулит бэкенд;
#   остальное из public (картинки, видео, шрифты PDF, robots, sitemap) —
#     имена без хэша, файл можно заменить → час.
map $uri $kb_cache_control {
    default         "public, max-age=3600";
    ~^/api/         "";
    ~^/assets/      "public, max-age=31536000, immutable";
    ~\.html$        "no-cache";
    /sw.js          "no-cache";
}

# ── noindex для непубличных страниц ──────────────────────────────────────
# Работает без JS (в отличие от мета-тега, который ставит ещё и RouteMeta).
# shell.html — оболочка /login, /register, /app, /history, /profile, /reports.
map $uri $kb_robots {
    default         "";
    /shell.html     "noindex, nofollow";
    /404.html       "noindex, nofollow";
}

server {
    # default_server: сюда идёт всё, что не домен API, — как и до разделения.
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # За хостовым nginx контейнер видит http: абсолютный Location в 301
    # (со слеша на канон) ушёл бы на http:// и дал двойной редирект.
    absolute_redirect off;

    # Яндекс Карты JS API 2.1 (спутник под реальными обходами на /app):
    # скрипт и модули — api-maps.yandex.ru и yastatic.net, тайлы — *.maps.yandex.net
    # (картинки и так разрешены img-src https:). Проверить в консоли, прежде
    # чем переводить Report-Only в боевую политику.
    set $ymaps_src "https://api-maps.yandex.ru https://*.maps.yandex.net https://yandex.ru https://yastatic.net";

    # ── Заголовки (все — здесь, см. шапку) ────────────────────────────────
    add_header Cache-Control $kb_cache_control always;
    add_header X-Robots-Tag $kb_robots always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # CSP. До 2026-09-28 на HTML она не приходила вовсе (см. шапку), то есть
    # приложение ни разу не работало под ней. Включить её разом = рискнуть
    # /app: предпросмотр PDF из blob, 3D, загрузки — всё это без входа не
    # проверить. Поэтому:
    #   • frame-ancestors — ПРИНУДИТЕЛЬНО. Встраивать сайт во фрейм можно только
    #     себе, чужим — нельзя (Метрика с её картой кликов убрана 08.10.2026).
    #     X-Frame-Options убран: в нём нельзя перечислить домены, а при обоих
    #     заголовках браузеры берут frame-ancestors, и SAMEORIGIN только путал.
    #   • остальная политика — Report-Only: браузер пишет нарушения в консоль,
    #     но ничего не блокирует. Пройти приложение с открытой консолью, и если
    #     нарушений нет — переименовать заголовок в Content-Security-Policy
    #     (и дописать туда frame-ancestors из первого).
    # Состав политики: script-src строгий ('self', без inline — полифилл в
    # бандле) + домены Яндекс Карт; 'wasm-unsafe-eval' —
    # wasm-декодеры three/pdf; style-src 'unsafe-inline' — инлайн-стили React;
    # frame-src/child-src blob: — iframe с blob-PDF; worker-src blob: — воркеры three;
    # connect-src широкий (https:/wss:) — GLB/PLY и фото приходят с разных
    # хостов. Google Fonts в политике нет: шрифты свои
    # (src/fonts), к fonts.googleapis.com/gstatic.com сайт не обращается.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' $ymaps_src; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; frame-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Gzip (html сжимается всегда; xml — sitemap, manifest+json — манифест PWA).
    # Brotli нет: в nginx:alpine нет модуля, нужен сторонний образ.
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               text/xml application/xml application/manifest+json;
    gzip_min_length 1000;

    # Всё, чего нет, — честный 404 со своей страницей (пререндер NotFound).
    # 404.html НЕ internal: service worker прекэширует её прямым запросом и
    # на 404-ответе не установился бы вовсе.
    error_page 404 /404.html;

    # API → backend (настройки — api-proxy.conf, общие с доменом API ниже).
    # ^~ — чтобы regex-локейшены ниже (слеш на конце!) не перехватывали
    # /api/…/: POST /api/analyses/ получил бы 301.
    # Основной вход в API теперь — свой домен (server в конце файла). Этот
    # остаётся для старых вкладок и приложения: пока хостовый nginx держит
    # пароль на весь домен сайта, сюда доходят только запросы без токена.
    location ^~ /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Хэшированные ассеты: только файлы, без фоллбэков.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # ── РОУТЫ SPA — белый список ─────────────────────────────────────────
    # Сверяется со сборкой (scripts/vite-plugin-seo.js): App.jsx, этот файл,
    # src/seo/routes.js и robots.txt обязаны совпадать, иначе `vite build`
    # падает. Новый роут без строки здесь получил бы честный 404.
    # Публичные — пререндер (HTML с текстом и метой без JS).
    # Главная с 2026-10-17 — статический лендинг public/lp.html (файлы — public/lp/),
    # а не пререндер Landing.jsx: index.html по-прежнему собирается, но на / не отдаётся.
    # Вернуть прежний лендинг = снова try_files /index.html.
    location = / {
        try_files /lp.html =404;
    }
    # Страница «Приложение для обхода» нового лендинга; сюда ведёт QR-код на первом экране.
    # Это не роут SPA (в App.jsx и routes.js её нет), поэтому путь до файла — с каталогом:
    # сверка в vite-plugin-seo.js такие строки не считает.
    location = /mobile {
        try_files /lp/mobile.html =404;
    }
    location = /privacy {
        try_files /privacy.html =404;
    }
    location = /consent {
        try_files /consent.html =404;
    }
    location = /terms {
        try_files /terms.html =404;
    }
    # Непубличные — пустая оболочка с noindex (map $kb_robots выше).
    #
    # ── ЗАКРЫТЫЙ ДОСТУП (basic auth) ─────────────────────────────────────
    # Публичен только лендинг и то, что ему нужно (статика, юр. страницы,
    # манифест, sw.js). Пароль спрашивается на входе в приложение: роуты ниже
    # и прямой /shell.html. Файл паролей в git НЕ лежит — монтируется из
    # корня репозитория на сервере (docker-compose.yml, ./.htpasswd).
    #
    # /api/ под паролем НЕ стоит и стоять не может: фронт шлёт туда
    # `Authorization: Bearer <JWT Supabase>`, а это тот же заголовок, что у
    # basic auth. Браузер не подставит Basic поверх своего Bearer → nginx
    # ответит 401 + WWW-Authenticate → окно входа поверх страницы (именно так
    # сломалось, когда пароль висел на всём домене). API защищён JWT на бэке.
    #
    # Связано с sw.js: оболочка shell.html убрана из прекэша, а SW больше не
    # перехватывает навигацию — иначе он отдавал бы /app из кэша мимо пароля,
    # а прекэш оболочки падал бы 401 у посетителей лендинга.
    # Снять закрытие = удалить две строки auth_basic* ниже и в /shell.html,
    # и вернуть sw.js/vite.config.js (см. комментарии там).
    location ~ ^/(login|register|app|history|profile|reports)$ {
        try_files /shell.html =404;
        auth_basic           "Volumetric";
        auth_basic_user_file /etc/nginx/htpasswd;
    }
    location = /shell.html {
        try_files /shell.html =404;
        auth_basic           "Volumetric";
        auth_basic_user_file /etc/nginx/htpasswd;
    }

    # Один канонический адрес: слеш на конце → 301 без слеша (/privacy/ → /privacy).
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # Манифест PWA: в mime.types образа nginx:1.27-alpine нет webmanifest, и
    # он уходил как application/octet-stream (так было и на проде).
    # default_type, а не types{}: types внутри location заменил бы всю таблицу.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Остальное — только реальные файлы из dist (robots.txt, sitemap.xml,
    # yandex_*.html, картинки, sw.js, манифест…). Нет файла → 404.
    location / {
        try_files $uri =404;
    }
}

# ════════════════════════════════════════════════════════════════════════
# ДОМЕН API — отдельно от сайта (2026-10-19).
# Хостовый nginx закрывает паролем (Basic) ВЕСЬ volumetric.gottland.ru.
# Фронт шлёт в API `Authorization: Bearer <JWT>` — тот же заголовок, что у
# Basic, поэтому /api/ на домене сайта после ввода пароля отвечал 401 на
# каждый вызов: сайт открывался, но ничего не загружал. API вынесен на свой
# домен, и пароля на нём нет и быть не должно — защита API это JWT на бэке
# (auth.py), а у /api/docs свой пароль (apidocs.py).
# Хостовый nginx отдаёт этот домен на тот же порт контейнера, что и сайт, с
# `proxy_set_header Host $host` — по имени сюда и попадаем. Что настроить на
# хосте — docs/API_HOST.md. Адрес API во фронте — API_BASE в src/api.js.
# Сменили имя домена → поправить здесь, в api.js и в docs/API_HOST.md.
# ════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name api.volumetric.gottland.ru;

    absolute_redirect off;

    # Заголовки — как у сайта, кроме того, что для страниц: API не HTML,
    # кэшем ответов рулит бэкенд. noindex — чтобы домен не попал в поиск.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_types application/json text/plain;   # text/html nginx сжимает всегда (Swagger)
    gzip_min_length 1000;

    location ^~ /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Кроме /api/ на этом домене ничего нет: сайт отсюда не раздаётся.
    location / {
        default_type application/json;
        return 404 '{"detail":"Not Found"}';
    }
}
